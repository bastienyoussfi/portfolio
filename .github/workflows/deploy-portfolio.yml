name: Deploy Portfolio

# Production deploy of apps/web to the Cloudflare Pages project "portfolio"
# (bastienyoussfi.com). Runs on push to main when the site or its data changes,
# and can be triggered manually from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'data/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-portfolio.yml'
  workflow_dispatch:

concurrency:
  group: deploy-portfolio
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version is read from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter web build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main targets the project's production branch, so this is a
          # production deployment (bastienyoussfi.com), not a preview.
          command: pages deploy apps/web/dist --project-name=portfolio --branch=main
